name: Build with CMake
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
    windows:
      name: Windows MSVC Release (TLS ${{ matrix.ssl }})
      runs-on: windows-2022
      timeout-minutes: 45
      strategy:
        fail-fast: false
        matrix:
          ssl: ['OFF', 'ON']
      env:
        OPENSSL_ROOT_DIR: C:/Program Files/OpenSSL
      steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record candidate and tools
        run: |
          git rev-parse HEAD
          cmake --version
          ruby --version
      - name: Configure MSVC
        run: cmake -S . -B . -G "Visual Studio 17 2022" -A x64 -DHAVE_SSL=${{ matrix.ssl }}
      - name: Build
        id: build
        run: cmake --build . --config Release --parallel 2
      - name: Run registered tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ctest -C Release --output-on-failure --no-tests=error --timeout 180
      - name: Verify acceptance ports
        id: ports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          foreach ($port in 6666..6670) {
            $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, $port)
            try { $listener.Start() } finally { $listener.Stop() }
          }
      - name: Run Windows acceptance harness
        if: ${{ !cancelled() && steps.ports.outcome == 'success' }}
        shell: cmd
        working-directory: test
        run: |
          call runat.bat release 6666
          exit /b %errorlevel%
      - name: Run performance checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: test
        run: |
          .\release\pt\pt.exe --quickfix-spec-path ..\spec -# "~[network]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\release\pt\pt.exe --quickfix-spec-path ..\spec -# "[network]" --port 6668
    build:
      runs-on: ${{ matrix.runner }}
      strategy:
          fail-fast: false
          matrix:
              runner: [ubuntu-latest]
              configuration: [Release]
              ssl: ['OFF', 'ON']
              include:
                - configuration: Release
                  config: release
                  portoffset: 0
      steps:
      - name: Echo event_name ${{ github.event_name }}
        shell: bash
        run: echo "github.event_name $event_name"
        env:
          event_name: ${{ github.event_name }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenSSL (macOS)
        if: matrix.ssl == 'ON' && matrix.runner == 'macos-latest'
        run: brew install openssl
      - name: Install OpenSSL (Linux)
        if: matrix.ssl == 'ON' && matrix.runner == 'ubuntu-latest'
        run: sudo apt-get install -y libssl-dev
      - name: Set OPENSSL_ROOT_DIR (macOS)
        if: matrix.ssl == 'ON' && matrix.runner == 'macos-latest'
        shell: bash
        run: echo "OPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl" >> $GITHUB_ENV
      - name: Set OPENSSL_ROOT_DIR (Windows)
        if: matrix.ssl == 'ON' && matrix.runner == 'windows-2022'
        shell: bash
        run: echo "OPENSSL_ROOT_DIR=C:/Program Files/OpenSSL" >> $GITHUB_ENV
      - name: Generate
        shell: bash
        run: |
          cmake . -DCMAKE_BUILD_TYPE=$Configuration \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install_prefix/$Configuration" \
            -DHAVE_SSL=$SSL ${OPENSSL_ROOT_DIR:+-DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"}
        env:
          Configuration: ${{ matrix.configuration }}
          SSL: ${{ matrix.ssl }}
          OPENSSL_ROOT_DIR: ${{ env.OPENSSL_ROOT_DIR }}
      - name: Build
        shell: bash
        run: |
          cmake --build . --config $Configuration --parallel 4
        env:
          Configuration: ${{ matrix.configuration }}
      - name: Set tests paths windows
        shell: bash
        if: ${{ matrix.runner == 'windows-2022' }}
        run: |
          echo "at=$PWD/test/$Config/at/at.exe" >> $GITHUB_ENV
          echo "pt=$PWD/test/$Config/pt/pt.exe" >> $GITHUB_ENV
          echo "ut=$PWD/test/$Config/ut/ut.exe" >> $GITHUB_ENV
        env:
          Config: ${{ matrix.config }}
      - name: Set tests paths ubuntu-latest
        shell: bash
        if: ${{ matrix.runner == 'ubuntu-latest' }}
        run: |
          echo "at=$PWD/test/at" >> $GITHUB_ENV
          echo "pt=$PWD/test/pt" >> $GITHUB_ENV
          echo "ut=$PWD/test/ut" >> $GITHUB_ENV
      - name: Set tests paths macos-latest
        shell: bash
        if: ${{ matrix.runner == 'macos-latest' }}
        run: |
          echo "at=$PWD/test/at" >> $GITHUB_ENV
          echo "pt=$PWD/test/pt" >> $GITHUB_ENV
          echo "ut=$PWD/test/ut" >> $GITHUB_ENV
      - name: Echo test paths ${{ matrix.runner }}
        shell: bash
        run: |
          echo "at: $at"
          echo "pt: $pt"
          echo "ut: $ut"
        env:
          at: ${{ env.at }}
          pt: ${{ env.pt }}
          ut: ${{ env.ut }}
      - name: Check if tests were built
        id: check_files
        shell: bash
        run: |
          AT=$( test -f $at && echo "true" || echo "false" )
          PT=$( test -f $pt && echo "true" || echo "false" )
          UT=$( test -f $ut && echo "true" || echo "false" )
          echo "at_check=$AT" >> $GITHUB_ENV
          echo "pt_check=$PT" >> $GITHUB_ENV
          echo "ut_check=$UT" >> $GITHUB_ENV
        env:
          at: ${{ env.at }}
          pt: ${{ env.pt }}
          ut: ${{ env.ut }}
      - name: Echo test checks ${{ matrix.runner }}
        shell: bash
        run: |
          echo "at_check: $at_check"
          echo "pt_check: $pt_check"
          echo "ut_check: $ut_check"
        env:
          at_check: ${{ env.at_check }}
          pt_check: ${{ env.pt_check }}
          ut_check: ${{ env.ut_check }}
      - name: Run acceptance tests for windows
        if: ${{ env.at_check == 'true' && matrix.runner == 'windows-2022' && github.event_name == 'pull_request' }}
        shell: cmd
        working-directory: ./test
        run: |
          set /a "PORT=%PortBase%+%Offset%"
          runat %CONFIG% %PORT%
        env:
          CONFIG: ${{ matrix.config }}
          PortBase: 6666
          Offset: ${{ matrix.portoffset }}
      - name: Run acceptance tests for ${{ matrix.runner }}
        if: ${{ env.at_check == 'true' && matrix.runner != 'windows-2022' && github.event_name == 'pull_request' }}
        shell: bash
        working-directory: ./test
        run: |
          RESULT=0
          ./runat.sh nonthreaded $(($PortBase + $Offset)) || RESULT=$?
          ./runat.sh threaded $(($ThreadedPortBase + $Offset)) || {
            LANE_RESULT=$?
            if [ "$RESULT" -eq 0 ]; then
              RESULT=$LANE_RESULT
            fi
          }
          exit "$RESULT"
        env:
          PortBase: 6666
          ThreadedPortBase: 6668
          Offset: ${{ matrix.portoffset }}
      - name: Run performance tests
        if: ${{ env.pt_check == 'true' && matrix.configuration == 'Release' }}
        shell: bash
        working-directory: ./test
        run: |
          if [ "$RUNNER_OS" != "Windows" ]; then
            ulimit -c 0
          fi
          RESULT=0
          "$pt" --quickfix-spec-path "$GITHUB_WORKSPACE/spec" -# "~[network]" || RESULT=$?
          "$pt" --quickfix-spec-path "$GITHUB_WORKSPACE/spec" -# "[network]" --port $(($PortBase + $Offset)) || {
            LANE_RESULT=$?
            if [ "$RESULT" -eq 0 ]; then
              RESULT=$LANE_RESULT
            fi
          }
          exit "$RESULT"
        env:
          pt: ${{ env.pt }}
          PortBase: 6668
          Offset: ${{ matrix.portoffset }}
      - name: Run unit tests
        if: ${{ env.ut_check == 'true' }}
        shell: bash
        working-directory: ./test
        run: |
          if [ "$RUNNER_OS" != "Windows" ]; then
            ulimit -c 0
          fi
          "$ut" --quickfix-config-file "$GITHUB_WORKSPACE/test/cfg/ut.cfg" \
            --quickfix-spec-path "$GITHUB_WORKSPACE/spec"
        env:
          ut: ${{ env.ut }}
